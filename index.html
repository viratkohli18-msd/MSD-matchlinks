<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Premium Live Cricket Stream Player - MSD">
    <meta name="theme-color" content="#0f172a">
    <title>Live Stream</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-deep: #0f172a;
            --bg-gradient: linear-gradient(to bottom, #0f172a 0%, #1e293b 100%);
            --glass-bg: rgba(30, 41, 59, 0.85);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-blur: blur(20px);
            --glass-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
            --accent-primary: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.25);
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.2);
            --success: #10b981;
            --gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        html, body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-deep);
            background-image: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: 50%;
            transform: translateX(-50%);
            width: 120%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(59, 130, 246, 0.08) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 100%;
            opacity: 0;
            transform: translateY(30px);
            animation: slideUpFade 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }

        /* --- Developer Credit Badge --- */
        .dev-badge {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--gold);
            z-index: 9999;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 15px var(--gold-glow);
            animation: badgePulse 3s infinite;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .dev-badge i { margin-right: 6px; color: #fbbf24; }

        @keyframes badgePulse {
            0%, 100% { box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 10px var(--gold-glow); }
            50% { box-shadow: 0 4px 25px rgba(0, 0, 0, 0.5), 0 0 20px var(--gold-glow); }
        }

        /* --- Header Styling --- */
        .stream-header {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            padding: 1rem 1.5rem;
            border-radius: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0;
            box-shadow: var(--glass-shadow);
        }

        .stream-header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .live-badge {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.25);
            padding: 0.4rem 1rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 12px var(--danger-glow);
            letter-spacing: 1px;
        }

        .live-badge i { font-size: 0.6rem; animation: pulseRed 2s infinite; }

        @keyframes pulseRed {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }

        /* --- Player Styling - FULL WIDTH --- */
        #player-container {
            width: 100%;
            height: 56.25vw;
            max-height: 60vh;
            background: #000;
            border-radius: 0;
            overflow: hidden;
            border: none;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 10;
        }

        /* --- Promo Card --- */
        .promo-card {
            display: block;
            margin: 20px 1rem;
            text-decoration: none;
            border-radius: 12px;
            overflow: hidden;
            background: #111;
            border: 2px solid var(--gold);
            box-shadow: 0 0 15px var(--gold-glow);
            transform: scale(1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .promo-card:active { transform: scale(0.98); }

        .promo-card img {
            width: 100%;
            height: auto;
            display: block;
            padding: 10px;
            object-fit: contain;
            background: #000;
        }

        .promo-text-area {
            background: linear-gradient(90deg, #ffae00, #ffcc00);
            color: #000;
            padding: 12px;
            text-align: center;
        }

        .promo-title {
            font-size: 18px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .promo-sub {
            display: inline-block;
            font-size: 14px;
            font-weight: 700;
            background: #d32f2f;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            animation: promoPulse 1.5s infinite;
        }

        @keyframes promoPulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(211, 47, 47, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(211, 47, 47, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(211, 47, 47, 0); }
        }

        /* --- Grid Panels --- */
        .grid-panels {
            display: grid;
            gap: 1.5rem;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            margin: 1rem;
        }

        .info-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            box-shadow: var(--glass-shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .info-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.3);
        }

        .info-card h2 {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        /* --- Buttons --- */
        .action-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            background: var(--accent-gradient);
            color: white;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
        }

        .action-button.copied { background: var(--success); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }

        /* --- Telegram Popup --- */
        .telegram-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem 2rem;
            border-radius: 20px;
            z-index: 10000;
            text-align: center;
            width: 90%;
            max-width: 400px;
            display: none;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .telegram-popup h2 { 
            color: var(--text-primary); 
            font-size: 1.5rem; 
            margin-bottom: 0.5rem; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .telegram-popup .fa-telegram { color: #2AABEE; }

        .telegram-popup p { 
            color: var(--text-secondary); 
            font-size: 0.95rem; 
            margin-bottom: 1.5rem; 
            line-height: 1.6;
        }

        .telegram-popup .popup-button {
            width: 100%;
            padding: 1rem;
            margin-top: 0.75rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s;
        }

        .telegram-popup .join-btn {
            background: #2AABEE;
            color: white;
            box-shadow: 0 4px 15px rgba(42, 171, 238, 0.3);
            border: none;
        }

        .telegram-popup .join-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(42, 171, 238, 0.4); }

        .telegram-popup .joined-btn {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .telegram-popup .joined-btn:hover { background: rgba(255, 255, 255, 0.05); color: var(--text-primary); }

        /* --- Custom Popup Overlay --- */
        .custom-popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 9998;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .custom-popup-box {
            background: rgba(15, 23, 42, 0.98);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .custom-popup-box h3 {
            color: var(--text-primary);
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }

        .custom-popup-box p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .custom-popup-box .popup-btn {
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            margin: 0 0.5rem;
            transition: all 0.2s;
        }

        .custom-popup-box .popup-btn-yes {
            background: var(--accent-gradient);
            color: white;
        }

        .custom-popup-box .popup-btn-no {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .stream-header { flex-direction: column; gap: 1rem; text-align: center; padding: 1rem; }
            .grid-panels { grid-template-columns: 1fr; gap: 1rem; margin: 0.5rem; }
            .telegram-popup { padding: 2rem 1.5rem; }
            .promo-card { margin: 15px 0.5rem; }
            .dev-badge { bottom: 10px; right: 10px; font-size: 0.65rem; padding: 8px 12px; }
        }

        /* Error Message Style */
        .error-message {
            background: var(--glass-bg);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 16px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            margin: 1rem;
        }
        .error-message h2 { color: #f87171; margin-bottom: 1rem; }
        .error-message p { color: var(--text-secondary); }
    </style>
</head>
<body>
    <main class="container">
        <div id="stream-content">
            <div style="height: 400px; display: flex; align-items: center; justify-content: center; color: var(--text-secondary);">
                <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
            </div>
        </div>
    </main>

    <!-- Developer Credit Badge -->
    <div class="dev-badge">
        <i class="fa-solid fa-code"></i> DEVELOPED BY MSD - KARAN
    </div>

    <!-- Telegram Popup -->
    <div class="telegram-popup" id="telegramPopup">
        <h2><i class="fa-brands fa-telegram"></i> Join The Action</h2>
        <p>Get instant updates, match highlights, and exclusive links on our official channel.</p>
        <a href="https://t.me/MSD_cricketlinks" target="_blank" rel="noopener noreferrer" class="popup-button join-btn">Join Channel Now</a>
        <button class="popup-button joined-btn" onclick="document.getElementById('telegramPopup').style.display='none';">I've Already Joined</button>
    </div>

    <!-- Custom Popup Overlay -->
    <div class="custom-popup-overlay" id="customPopup">
        <div class="custom-popup-box">
            <h3><i class="fa-brands fa-telegram" style="color: #2AABEE;"></i> Join For More!</h3>
            <p>Get all live match links, highlights & updates directly on Telegram.</p>
            <button class="popup-btn popup-btn-yes" onclick="window.open('https://t.me/MSD_cricketlinks','_blank'); document.getElementById('customPopup').style.display='none';">Join Now</button>
            <button class="popup-btn popup-btn-no" onclick="document.getElementById('customPopup').style.display='none';">Maybe Later</button>
        </div>
    </div>

    <script>
        const promoHTML = `
        <a href="https://t.me/MSD_cricketlinks" target="_blank" rel="noopener noreferrer" class="promo-card">
            <div class="promo-text-area">
                <div class="promo-title">MSD Cricket Links</div>
                <span class="promo-sub">Join Telegram For Live Links</span>
            </div>
        </a>
        `;

        async function initializeApp() {
            try {
                const response = await fetch('https://allrounder2-0.pages.dev/id.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();

                const urlParams = new URLSearchParams(window.location.search);
                const streamId = urlParams.get('id');
                const streamData = data.iframes.find(item => item.id === streamId);

                if (streamData) {
                    document.title = `${streamData.name} // Live Stream`;
                    renderIframeUI(streamData);

                    setTimeout(() => { document.getElementById('telegramPopup').style.display = 'block'; }, 2000);
                } else {
                    renderErrorUI("Stream Not Found", "The requested stream ID is invalid, or the stream is currently offline.");
                }

            } catch (error) {
                console.error("Failed to fetch streams:", error);
                renderErrorUI("Connection Failed", "Could not load stream configuration. Please check your internet connection.");
            }
        }

        function renderIframeUI(data) {
            const contentDiv = document.getElementById('stream-content');
            contentDiv.innerHTML = `
                <div class="stream-header">
                    <h1>${data.name}</h1>
                    <span class="live-badge"><i class="fa-solid fa-circle"></i> LIVE NOW</span>
                </div>

                <div id="player-container">
                    <iframe 
                        src="${data.iframeSrc}" 
                        style="width:100%; height:100%; border:0;" 
                        allow="encrypted-media; autoplay" 
                        allowfullscreen>
                    </iframe>
                </div>

                ${promoHTML}

                <div class="info-card">
                        <h2><i class="fa-solid fa-share-nodes"></i> Share Stream</h2>
                        <button class="action-button" id="shareButton">
                             Click Here To Share This Page Link ❤️
                        </button>
                    </div>
                </div>
            `;
            document.getElementById('shareButton').addEventListener('click', copyAndShare);
        }

        function renderErrorUI(title, message) {
            const contentDiv = document.getElementById('stream-content');
            document.title = `Error - ${title}`;
            contentDiv.innerHTML = `
                <div class="error-message">
                    <h2><i class="fa-solid fa-triangle-exclamation"></i> ${title}</h2>
                    <p>${message}</p>
                </div>
            `;
        }

        async function copyAndShare() {
            const shareButton = document.getElementById('shareButton');
            const originalHTML = shareButton.innerHTML;
            try {
                await navigator.clipboard.writeText(window.location.href);
                shareButton.innerHTML = `<i class="fa-solid fa-check"></i> Link Copied!`;
                setTimeout(() => { shareButton.innerHTML = originalHTML; shareButton.classList.remove('copied'); }, 2000);
            } catch (err) { console.error('Failed to copy link:', err); }
        }

        document.addEventListener("DOMContentLoaded", initializeApp);

        setTimeout(() => {
            let firstPopup = confirm("Join Here For More Live Match Link");
            if (firstPopup) {
                window.location.href = "https://t.me/MSD_cricketlinks";
            }

            setTimeout(() => {
                document.getElementById("customPopup").style.display = "flex";
            }, 500);
        }, 1000);
    </script>
</body>
</html>
