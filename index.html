<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player</title>
<style>
  :root{--bg:#0a0a0f;--fg:#e8e8f0;--dim:#8888a0;--accent:#6a5acd;--danger:#e74c3c}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  #app{height:100%;display:flex;flex-direction:column}
  #bar{display:flex;align-items:center;gap:10px;padding:10px 16px;
    border-bottom:1px solid #222;font-size:14px;flex-shrink:0}
  #bar .name{font-weight:600}
  #bar .id{color:var(--dim);font-size:12px}
  #bar .live{margin-left:auto;color:var(--danger);font-size:11px;font-weight:700}
  #wrap{flex:1;position:relative;background:#000;min-height:0}
  video{width:100%;height:100%;display:block;background:#000}
  #overlay{position:absolute;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;padding:24px;
    text-align:center;background:rgba(0,0,0,.93);z-index:10;overflow-y:auto}
  #overlay.on{display:flex}
  #overlay h1{font-size:20px;margin:0}
  #overlay p{font-size:13px;color:var(--dim);margin:0;max-width:560px;
    line-height:1.6;word-break:break-word}
  #overlay code{background:#1a1a24;padding:2px 6px;border-radius:4px;color:#c8c8ff;
    font-family:ui-monospace,monospace}
  .btn{padding:9px 16px;border-radius:8px;background:#24243a;color:var(--fg);
    border:1px solid #333;font-size:13px;cursor:pointer}
  .btn:hover{background:#2e2e48}
  #unmute{position:absolute;bottom:16px;left:16px;display:none;z-index:11}
  #unmute.on{display:block}
  .spin{width:36px;height:36px;border:3px solid #333;border-top-color:var(--accent);
    border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span class="name" id="ch-name">—</span>
    <span class="id" id="ch-id"></span>
    <span class="live" id="live" style="display:none">● LIVE</span>
  </div>
  <div id="wrap">
    <video id="video" playsinline muted></video>
    <button class="btn" id="unmute">🔊 Tap to unmute</button>
    <div id="overlay"><div id="ov-body"></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.7.11/dist/shaka-player.compiled.js"></script>
<script>
'use strict';

/* ------------------------------------------------------------
   CONFIG
   ------------------------------------------------------------ */
const DATA_URL = 'https://sportlink-tv11.pages.dev/Data.json';

/* Optional proxy. Leave empty for native query-token mode.
   If Jio returns 403/1001, deploy the Worker proxy and set either:
     const PROXY = 'https://your-worker.workers.dev/';
   or open the page with  &proxy=https://your-worker.workers.dev/
*/
const PROXY = new URLSearchParams(location.search).get('proxy') || '';

/* ------------------------------------------------------------
   HELPERS
   ------------------------------------------------------------ */
const $ = (s) => document.querySelector(s);
const video = $('#video');
const overlay = $('#overlay');

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function show(html) { $('#ov-body').innerHTML = html; overlay.classList.add('on'); }
function hide() { overlay.classList.remove('on'); }

function idNotFound(id, ids) {
  const sample = ids && ids.length
    ? `<p>Valid IDs in this JSON: ${ids.slice(0,8).map(x=>`<code>${x}</code>`).join(', ')}.</p>`
    : '';
  show(`
    <h1>ID not found</h1>
    <p>Open this page with a channel ID, for example <code>/?id=${ids[0]||'162'}</code>.</p>
    ${id ? `<p>Requested: <code>${escapeHtml(id)}</code></p>` : ''}
    ${sample}
  `);
}

/* ------------------------------------------------------------
   BOOT
   ------------------------------------------------------------ */
(async function main() {
  const id = new URLSearchParams(location.search).get('id');

  if (!id) {
    try {
      const data = await fetchJson();
      idNotFound('', (data.channels||[]).map(c=>String(c.id)));
    } catch {
      idNotFound('', []);
    }
    return;
  }

  show(`<div class="spin"></div><p>Loading channels…</p>`);

  let data;
  try {
    data = await fetchJson();
  } catch (err) {
    show(`<h1>Failed to load Data.json</h1><p>${escapeHtml(err.message)}</p>
      <button class="btn" onclick="location.reload()">Retry</button>`);
    return;
  }

  const channels = data.channels || [];
  const ch = channels.find(c => String(c.id) === String(id));

  if (!ch) {
    idNotFound(id, channels.map(c => String(c.id)));
    return;
  }

  if (ch.cookie_expire && Number(ch.cookie_expire) * 1000 < Date.now()) {
    const when = ch.cookie_expire_ist ||
      new Date(Number(ch.cookie_expire) * 1000).toISOString();
    show(`<h1>Token expired</h1>
      <p>The <code>__hdnea__</code> token for this channel expired at
      <b>${escapeHtml(when)}</b>.</p>
      <p>Refresh <code>Data.json</code> at the source, then reload.</p>
      <button class="btn" onclick="location.reload()">Reload</button>`);
    return;
  }

  $('#ch-name').textContent = ch.name || ('Channel ' + id);
  $('#ch-id').textContent = 'ID ' + ch.id;

  try {
    await play(ch);
    hide();
    $('#live').style.display = '';
    $('#unmute').classList.add('on');
  } catch (err) {
    showPlaybackError(ch, err);
  }
})();

async function fetchJson() {
  const res = await fetch(DATA_URL, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status + ' for ' + DATA_URL);
  return await res.json();
}

/* ------------------------------------------------------------
   PLAYER
   ------------------------------------------------------------ */
let shakaPlayer = null;

async function play(ch) {
  if (typeof shaka === 'undefined') throw new Error('shaka-player CDN failed to load');
  shaka.polyfill.installAll();
  if (!shaka.Player.isBrowserSupported()) throw new Error('Browser does not support DASH');

  const token = extractToken(ch);
  const clearKeys = buildKeys(ch);

  shakaPlayer = new shaka.Player();
  await shakaPlayer.attach(video);
  shakaPlayer.addEventListener('error', onShakaError);

  shakaPlayer.configure({
    drm: {
      clearKeys,
      retryParameters: { maxAttempts: 2, baseDelay: 500, timeout: 20000 }
    },
    manifest: {
      retryParameters: { maxAttempts: 3, baseDelay: 500, backoffFactor: 2, timeout: 30000 }
    },
    streaming: {
      retryParameters: { maxAttempts: 3, baseDelay: 500, backoffFactor: 2, timeout: 30000 },
      bufferingGoal: 30,
      rebufferingGoal: 2
    },
    abr: { enabled: true, defaultBandwidthEstimate: 2000000 }
  });

  // Append token to manifest AND every segment request.
  const net = shakaPlayer.getNetworkingEngine();
  if (net) {
    net.registerRequestFilter((type, request) => {
      request.uris = request.uris.map(u => decorate(u, token));
      if (PROXY && token) request.headers['X-Cookie'] = '__hdnea__=' + token;
    });
  }

  await shakaPlayer.load(decorate(ch.stream_url, token));

  const variants = shakaPlayer.getVariantTracks();
  if (!variants.length) throw new Error('Manifest loaded but no playable tracks found');

  video.muted = true;
  try { await video.play(); } catch {}

  const btn = $('#unmute');
  btn.onclick = () => { video.muted = false; btn.classList.remove('on'); };
}

function extractToken(ch) {
  const raw = ch.cookie || '';
  const m = raw.match(/__hdnea__=([^;]+)/);
  return m ? m[1].trim() : raw.trim();
}

function buildKeys(ch) {
  const out = {};
  for (const pair of ch.sportlink || []) {
    const i = pair.indexOf(':');
    if (i < 0) continue;
    out[pair.slice(0, i).trim().toLowerCase()] =
      pair.slice(i + 1).trim().toLowerCase();
  }
  if (ch.key_id && ch.key && !out[String(ch.key_id).toLowerCase()]) {
    out[String(ch.key_id).toLowerCase()] = String(ch.key).toLowerCase();
  }
  return out;
}

function decorate(url, token) {
  if (!url || /^(data:|blob:|about:)/i.test(url)) return url;
  let out = url;

  if (token && !/[?&]__hdnea__=/.test(out)) {
    out += (out.includes('?') ? '&' : '?') + '__hdnea__=' + token;
  }
  if (PROXY && !out.startsWith(PROXY)) out = PROXY + out;
  return out;
}

/* ------------------------------------------------------------
   ERRORS
   ------------------------------------------------------------ */
function onShakaError(event) {
  const err = event.detail || event;
  showPlaybackError(null, err);
}

function showPlaybackError(ch, err) {
  const code = err && err.code;
  const msg = (err && err.message) || String(err);
  let hint = '';

  if (code === 1001 || code === 6001 || code === 6004 || /403/.test(msg)) {
    hint = `
      <p>The CDN refused the request. Two common causes:</p>
      <p>1. Token expired, or your IP is outside India (JioTV is geo-restricted).<br>
         2. Browser cannot send a <code>Cookie</code> header. If query-token mode is rejected,
         add a proxy:<br>
         <code>/?id=${ch ? ch.id : '162'}&amp;proxy=https://your-worker.workers.dev/</code></p>
    `;
  } else if (code === 1002) {
    hint = '<p>Manifest parse failed — CDN probably returned an HTML error page instead of an MPD.</p>';
  } else if (code === 1003 || code === 3016) {
    hint = '<p>DRM keys in <code>Data.json</code> are invalid or expired for this stream.</p>';
  }

  show(`<h1>Playback failed${code ? ' ('+code+')' : ''}</h1>
    <p>${escapeHtml(msg)}</p>${hint}
    <button class="btn" onclick="location.reload()">Retry</button>`);
}
</script>
</body>
</html>
