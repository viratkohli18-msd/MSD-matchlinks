<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>IPTV Player v2 — with diagnostics</title>
<style>
:root{
  --bg:#0a0a0f;--bg-elev:#12121a;--bg-hover:#1a1a24;--bg-active:#24243a;
  --border:#2a2a3a;--border-focus:#4a4a6a;--text:#e8e8f0;--text-dim:#8888a0;
  --text-muted:#5a5a70;--accent:#6a5acd;--accent-hover:#7a6add;
  --accent-glow:rgba(106,90,205,.35);--danger:#e74c3c;--success:#2ecc71;
  --warning:#f39c12;--radius:8px;--sidebar-w:320px;--transition:150ms ease;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;
  border:none;cursor:pointer;padding:0;}
input{font-family:inherit;font-size:inherit;}

.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100vh;width:100vw;}
@media(max-width:768px){.app{grid-template-columns:1fr;}.sidebar{display:none;}.sidebar.open{display:flex;position:fixed;inset:0 auto 0 0;width:280px;z-index:100;}}

.sidebar{display:flex;flex-direction:column;background:var(--bg-elev);
  border-right:1px solid var(--border);overflow:hidden;min-width:0;}
.sidebar-header{padding:14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:10px;}
.sidebar-title{display:flex;align-items:center;justify-content:space-between;}
.sidebar-title h1{font-size:14px;font-weight:600;margin:0;}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;
  padding:0 6px;border-radius:10px;background:var(--bg-active);color:var(--text-dim);
  font-size:11px;font-weight:600;}
.search-input{width:100%;height:34px;padding:0 12px;background:var(--bg);
  border:1px solid var(--border);border-radius:var(--radius);color:var(--text);outline:none;}
.search-input:focus{border-color:var(--border-focus);}
.search-input::placeholder{color:var(--text-muted);}

.channel-list{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:4px;}
.channel-list::-webkit-scrollbar{width:6px;}
.channel-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

.channel-item{display:flex;align-items:center;gap:10px;padding:10px 12px;
  border-radius:var(--radius);border:1px solid transparent;color:var(--text);
  text-align:left;cursor:pointer;transition:background var(--transition);width:100%;}
.channel-item:hover{background:var(--bg-hover);}
.channel-item.active{background:var(--bg-active);border-color:var(--accent);}
.ch-icon{width:32px;height:32px;border-radius:6px;background:var(--bg-active);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
  color:var(--text-dim);flex-shrink:0;}
.ch-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.ch-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ch-meta{font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ch-status{width:8px;height:8px;border-radius:50%;background:var(--text-muted);flex-shrink:0;}
.ch-status.unknown{background:var(--text-muted);}
.ch-status.testing{background:var(--warning);animation:pulse 1s infinite;}
.ch-status.ok{background:var(--success);}
.ch-status.fail{background:var(--danger);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

.sidebar-footer{padding:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;}
.proxy-wrap{display:flex;flex-direction:column;gap:4px;}
.proxy-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;}
.proxy-input{height:30px;padding:0 8px;background:var(--bg);border:1px solid var(--border);
  border-radius:6px;color:var(--text);font-size:11px;font-family:ui-monospace,monospace;outline:none;}
.proxy-input:focus{border-color:var(--border-focus);}
.footer-btns{display:flex;gap:6px;}
.toggle-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  height:30px;padding:0 8px;border-radius:6px;background:var(--bg);
  border:1px solid var(--border);color:var(--text-dim);font-size:11px;transition:all var(--transition);}
.toggle-btn:hover{background:var(--bg-hover);color:var(--text);}
.toggle-btn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.toggle-btn.danger{color:var(--danger);}
.toggle-btn.danger:hover{background:rgba(231,76,60,.15);}

.main{display:flex;flex-direction:column;min-width:0;position:relative;background:#000;}
.player-stage{position:relative;flex:1;min-height:0;background:#000;overflow:hidden;}
.player-shell{position:absolute;inset:0;display:none;background:#000;}
.player-shell.active{display:block;}
.player-shell video,.player-shell iframe{width:100%;height:100%;object-fit:contain;
  border:none;background:#000;display:block;}

.empty-state{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;color:var(--text-muted);
  text-align:center;padding:40px;}
.empty-state .icon{font-size:48px;opacity:.6;}
.empty-state h2{font-size:16px;font-weight:600;color:var(--text-dim);margin:0;}
.empty-state p{font-size:13px;margin:0;max-width:300px;line-height:1.5;}

/* Overlays */
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:12px;padding:24px;z-index:15;text-align:center;}
.overlay.active{display:flex;}
.overlay.loading{background:rgba(0,0,0,.8);}
.overlay.error{background:rgba(20,5,5,.95);}
.overlay.diag{background:rgba(5,10,20,.97);align-items:stretch;justify-content:flex-start;text-align:left;overflow-y:auto;}
.spinner{width:44px;height:44px;border:3px solid rgba(255,255,255,.15);
  border-top-color:var(--accent);border-radius:50%;animation:spin 800ms linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:13px;color:var(--text-dim);max-width:400px;text-align:center;}
.loading-stage{font-size:11px;color:var(--text-muted);font-family:ui-monospace,monospace;}

.error-icon{font-size:40px;color:var(--danger);}
.error-title{font-size:16px;font-weight:600;}
.error-msg{font-size:12px;color:var(--text-dim);max-width:560px;line-height:1.6;
  font-family:ui-monospace,monospace;word-break:break-word;
  background:rgba(0,0,0,.4);padding:12px;border-radius:6px;border:1px solid var(--border);}
.error-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}

.btn{padding:8px 16px;border-radius:var(--radius);background:var(--bg-active);
  border:1px solid var(--border);color:var(--text);font-size:13px;transition:background var(--transition);}
.btn:hover{background:var(--bg-hover);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{background:var(--accent-hover);}
.btn.danger{background:rgba(231,76,60,.2);border-color:var(--danger);color:var(--danger);}

/* Diagnostics */
.diag-header{display:flex;align-items:center;justify-content:space-between;
  padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:12px;flex-shrink:0;}
.diag-header h2{font-size:16px;margin:0;font-weight:600;}
.diag-close{width:32px;height:32px;border-radius:6px;display:flex;
  align-items:center;justify-content:center;font-size:20px;color:var(--text-dim);}
.diag-close:hover{background:var(--bg-hover);}
.diag-channel{border:1px solid var(--border);border-radius:var(--radius);
  padding:12px;margin-bottom:8px;background:rgba(255,255,255,.02);}
.diag-channel h3{font-size:13px;margin:0 0 8px;font-weight:600;display:flex;
  align-items:center;justify-content:space-between;}
.diag-row{display:flex;gap:8px;font-size:11px;font-family:ui-monospace,monospace;
  padding:3px 0;align-items:flex-start;line-height:1.5;}
.diag-label{color:var(--text-muted);flex-shrink:0;min-width:100px;}
.diag-value{color:var(--text-dim);word-break:break-all;flex:1;}
.diag-value.ok{color:var(--success);}
.diag-value.bad{color:var(--danger);}
.diag-value.warn{color:var(--warning);}
.diag-verdict{padding:6px 8px;border-radius:4px;font-size:11px;margin-top:8px;
  font-family:ui-monospace,monospace;}
.diag-verdict.ok{background:rgba(46,204,113,.15);color:var(--success);}
.diag-verdict.bad{background:rgba(231,76,60,.15);color:var(--danger);}
.diag-verdict.warn{background:rgba(243,156,18,.15);color:var(--warning);}

/* Debug panel */
.debug-panel{position:absolute;right:12px;top:12px;max-width:420px;max-height:50vh;
  overflow-y:auto;background:rgba(10,10,15,.95);border:1px solid var(--border);
  border-radius:var(--radius);padding:10px;font-family:ui-monospace,monospace;
  font-size:10px;color:var(--text-dim);display:none;z-index:25;line-height:1.6;
  white-space:pre-wrap;word-break:break-all;}
.debug-panel.on{display:block;}

/* Toast */
.toast-container{position:fixed;top:20px;right:20px;display:flex;flex-direction:column;
  gap:8px;z-index:1000;pointer-events:none;}
.toast{padding:10px 14px;background:var(--bg-elev);border:1px solid var(--border);
  border-left:3px solid var(--accent);border-radius:var(--radius);font-size:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.4);animation:slideIn 200ms ease;max-width:380px;}
.toast.error{border-left-color:var(--danger);}
.toast.success{border-left-color:var(--success);}
.toast.warn{border-left-color:var(--warning);}
@keyframes slideIn{from{transform:translateX(20px);opacity:0;}to{transform:translateX(0);opacity:1;}}

/* Controls */
.controls{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 16px;
  background:linear-gradient(to top,rgba(0,0,0,.95),rgba(0,0,0,.7) 40%,transparent);
  display:flex;flex-direction:column;gap:8px;opacity:0;
  transition:opacity 200ms ease;pointer-events:none;z-index:10;}
.player-stage.controls-visible .controls{opacity:1;pointer-events:auto;}
.progress-row{display:flex;align-items:center;gap:10px;height:14px;}
.time-label{font-size:11px;font-variant-numeric:tabular-nums;color:var(--text-dim);
  min-width:48px;text-align:center;}
.progress-bar{flex:1;height:4px;background:rgba(255,255,255,.18);border-radius:2px;
  position:relative;cursor:pointer;}
.progress-bar:hover{height:6px;}
.progress-fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);
  border-radius:2px;width:0;transition:width 80ms linear;}
.progress-buffer{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.25);
  border-radius:2px;width:0;}
.controls-row{display:flex;align-items:center;gap:8px;}
.ctrl-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius);transition:background var(--transition);}
.ctrl-btn:hover{background:rgba(255,255,255,.1);}
.volume-wrap{display:flex;align-items:center;gap:6px;}
.volume-slider{width:0;opacity:0;overflow:hidden;transition:width 200ms ease,opacity 200ms ease;
  accent-color:var(--accent);}
.volume-wrap:hover .volume-slider{width:80px;opacity:1;}
.spacer{flex:1;}
.mobile-menu-btn{display:none;position:absolute;top:12px;left:12px;width:36px;height:36px;
  background:rgba(0,0,0,.6);border-radius:var(--radius);z-index:30;
  align-items:center;justify-content:center;}
@media(max-width:768px){.mobile-menu-btn{display:flex;}}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">
        <h1>Channels</h1>
        <span class="badge" id="channel-count">0</span>
      </div>
      <input type="search" id="channel-search" class="search-input" placeholder="Search..." />
    </div>
    <nav class="channel-list" id="channel-list"></nav>
    <div class="sidebar-footer">
      <div class="proxy-wrap">
        <span class="proxy-label">CORS Proxy (optional)</span>
        <input type="text" id="proxy-input" class="proxy-input"
               placeholder="http://localhost:8080/?url=" />
      </div>
      <div class="footer-btns">
        <button class="toggle-btn" id="diag-btn">Diagnostics</button>
        <button class="toggle-btn" id="debug-btn">Debug</button>
        <button class="toggle-btn danger" id="reload-btn" title="Reload page">↻</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>

    <div class="player-stage" id="player-stage">
      <div class="empty-state" id="empty-state">
        <div class="icon">▶</div>
        <h2>Select a channel</h2>
        <p>Click a channel in the sidebar. If it fails, open Diagnostics to see why.</p>
      </div>

      <div class="overlay loading" id="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loading-text">Loading...</div>
        <div class="loading-stage" id="loading-stage"></div>
      </div>

      <div class="overlay error" id="error-overlay">
        <div class="error-icon">⚠</div>
        <div class="error-title" id="error-title">Playback error</div>
        <div class="error-msg" id="error-msg"></div>
        <div class="error-actions">
          <button class="btn primary" id="error-retry">Retry</button>
          <button class="btn" id="error-open">Open URL</button>
          <button class="btn" id="error-diag">Diagnostics</button>
          <button class="btn" id="error-dismiss">Dismiss</button>
        </div>
      </div>

      <div class="overlay diag" id="diag-overlay">
        <div class="diag-header">
          <h2>Diagnostics</h2>
          <button class="diag-close" id="diag-close">×</button>
        </div>
        <div id="diag-content"></div>
      </div>

      <div class="debug-panel" id="debug-panel"></div>

      <div class="controls" id="controls">
        <div class="progress-row">
          <span class="time-label" id="time-current">--:--</span>
          <div class="progress-bar" id="progress-bar">
            <div class="progress-buffer" id="progress-buffer"></div>
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <span class="time-label" id="time-duration">--:--</span>
        </div>
        <div class="controls-row">
          <button class="ctrl-btn" id="btn-play">▶</button>
          <div class="volume-wrap">
            <button class="ctrl-btn" id="btn-mute">🔊</button>
            <input type="range" min="0" max="1" step="0.01" value="1"
                   class="volume-slider" id="volume-slider" />
          </div>
          <div class="spacer"></div>
          <button class="ctrl-btn" id="btn-pip" title="PiP">⧉</button>
          <button class="ctrl-btn" id="btn-fullscreen" title="Fullscreen">⛶</button>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.7.11/dist/shaka-player.compiled.js"></script>
<script>
'use strict';

/* ============================================================
   CONFIG
   ============================================================ */
const CHANNELS = {
  "star-hindi": {
    name: "Star Sports Hindi (Sony Ten 3)",
    type: "dash",
    stream_url: "https://jiotvpllive.cdn.jio.com/bpk-tv/SonySportsTen3HinHDSTB_BTS/WDVLive/index.mpd",
    drm_keys: [
      "c20ba4e9d0635bab9f17b177f0d91039:fcb4a266539ac7b03ef02c5600c5598d",
      "c592c427c0d35e9a8ad88cdcb76a16c1:8ecb737e4015c22451d6c14fe37e9e15",
      "10f4930166fa5b6ab5d71a4a978bdfac:9dfa22aa4d6a3d820101f59013de0236",
      "140edf90fa0b5c99864f2442df4df535:991b51ed2e690c96163a31ae4a6f6452",
      "e392571e46bd5461854986ae9e58083d:1167c024aa8bbad2c1beaf218cfeec11"
    ],

    type: "dash",
    stream_url: "https://jiotvpllive.cdn.jio.com/bpk-tv/Star_Sports_HD1_BTS/WDVLive/index.mpd",
    drm_keys: [
      "f217e9fe133e5b948c323abef1e39b47:63640dc4430d14003def0c97a2dbab4d",
      "06dd6287c4b956419d15d6c8e513aeed:a82d6b850b5c281c0054fc6d55e1c6ba",
      "45825561f4ef516691a9e16d1d35dd1d:3951fe7fbf4b0b33e6246fc401f76797",
      "bf95222d9be85d85a91281e796e99481:bc932276031b3e63758cf67b147c3557",
      "eda3132244745c10920b01536bc8a75b:2b5f8bdba279032943a040078bb22b35"
    ],

  },

    type: "dash",
    stream_url: "https://a96aivottlinear-a.akamaihd.net/OTTB/iad-nitro/enc/1vdoqfiqvt/out/v1/0fbbc55b90b74ce9b62ef2cf1391951d/cenc.mpd",
    drm_keys: [
      "fa34fa8c90336dd528c7a23871cad1fe:552a78d1aeb74f1650d68255c5749408"
    ],
    cookie_url: null
  },
  "ramayana": {
    name: "Ramayana",
    type: "iframe",
    stream_url: "https://playdrive.vip/e/AQGrE48AAgDqcw"
  }
};

/* ============================================================
   PROXY HELPER
   User sets this in the sidebar or localStorage.
   Format: prefix that takes the URL appended at the end.
   Example: "http://localhost:8080/?url=" or "https://corsproxy.io/?"
   ============================================================ */
const Proxy = {
  KEY: 'iptv.proxy',
  get() { try { return localStorage.getItem(this.KEY) || ''; } catch { return ''; } },
  set(v) { try { localStorage.setItem(this.KEY, v || ''); } catch {} },
  wrap(url) {
    const p = this.get();
    if (!p || !url) return url;
    // If the proxy prefix already ends with '=' or '?', just append
    if (/[=?&]$/.test(p) || p.endsWith('/')) return p + encodeURIComponent(url);
    return p + encodeURIComponent(url);
  }
};

/* ============================================================
   UTILS
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const el = (tag, attrs = {}, children = []) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else if (v != null) n.setAttribute(k, v);
  }
  for (const c of children) {
    if (typeof c === 'string') n.appendChild(document.createTextNode(c));
    else if (c) n.appendChild(c);
  }
  return n;
};
function fmtTime(s) {
  if (!isFinite(s) || s < 0) return '--:--';
  const x = Math.floor(s % 60), m = Math.floor((s / 60) % 60), h = Math.floor(s / 3600);
  const p = n => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${p(m)}:${p(x)}` : `${p(m)}:${p(x)}`;
}
function toast(msg, kind = '') {
  const t = el('div', { class: `toast ${kind}`, text: msg });
  $('#toast-container').appendChild(t);
  setTimeout(() => {
    t.style.transition = 'opacity 200ms ease';
    t.style.opacity = '0';
    setTimeout(() => t.remove(), 220);
  }, 4000);
}
function parseDrmKeys(arr) {
  const o = {};
  for (const s of arr || []) {
    const i = s.indexOf(':');
    if (i < 0) continue;
    o[s.slice(0, i).trim().toLowerCase()] = s.slice(i + 1).trim().toLowerCase();
  }
  return o;
}

/* ============================================================
   PROBE
   Test a URL for CORS and reachability.
   Returns { ok, status, cors, error }
   ============================================================ */
async function probeUrl(url, opts = {}) {
  const { proxy = false, headers = {}, method = 'GET' } = opts;
  const target = proxy ? Proxy.wrap(url) : url;
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 15000);
    const resp = await fetch(target, {
      method,
      headers,
      signal: ctrl.signal,
      mode: 'cors',
      credentials: 'omit',
      cache: 'no-store'
    });
    clearTimeout(timer);
    // Force read to catch CORS on body
    const text = await resp.text();
    return {
      ok: resp.ok,
      status: resp.status,
      cors: true,
      size: text.length,
      preview: text.slice(0, 120),
      content_type: resp.headers.get('content-type') || ''
    };
  } catch (err) {
    return {
      ok: false,
      cors: false,
      error: err.message || String(err)
    };
  }
}

/* ============================================================
   COOKIE FETCHER
   ============================================================ */
class CookieFetcher {
  constructor(url) { this.url = url; this.cookie = null; this.error = null; this.lastProbe = null; }
  async load() {
    if (!this.url) { this.lastProbe = { skipped: true }; return null; }
    // Try direct, then via proxy
    let r = await probeUrl(this.url);
    let usedProxy = false;
    if (!r.ok) {
      const proxied = await probeUrl(this.url, { proxy: true });
      if (proxied.ok) { r = proxied; usedProxy = true; }
    }
    this.lastProbe = { ...r, usedProxy };
    if (!r.ok) { this.error = r.error || `HTTP ${r.status}`; return null; }
    try {
      const data = JSON.parse(r.preview.length < 120 ? r.preview : await this._refetch(usedProxy));
      this.cookie = this._normalize(data);
      return this.cookie;
    } catch (e) {
      // Try as plain text
      if (r.preview.includes('=')) { this.cookie = r.preview.trim(); return this.cookie; }
      this.error = 'parse: ' + e.message;
      return null;
    }
  }
  async _refetch(usedProxy) {
    const url = usedProxy ? Proxy.wrap(this.url) : this.url;
    const resp = await fetch(url, { cache: 'no-store', credentials: 'omit' });
    return await resp.text();
  }
  _normalize(data) {
    if (typeof data === 'string') return data.trim();
    if (!data || typeof data !== 'object') return null;
    if (typeof data.Cookie === 'string') return data.Cookie;
    if (typeof data.cookie === 'string') return data.cookie;
    if (Array.isArray(data.cookies))
      return data.cookies.filter(c => c && c.name)
        .map(c => `${c.name}=${c.value ?? ''}`).join('; ');
    const pairs = [];
    for (const [k, v] of Object.entries(data)) {
      if (['expires','domain','path','secure','httponly','samesite'].includes(k.toLowerCase())) continue;
      if (typeof v === 'string' || typeof v === 'number') pairs.push(`${k}=${v}`);
    }
    return pairs.length ? pairs.join('; ') : null;
  }
}

/* ============================================================
   CHANNEL CONTROLLER
   ============================================================ */
class ChannelController {
  constructor(id, cfg, app) {
    this.id = id; this.config = cfg; this.app = app;
    this.shaka = null; this.initialized = false; this.state = 'idle';
    this.videoEl = null; this.iframeEl = null; this.shellEl = null;
    this.cookies = new CookieFetcher(cfg.cookie_url || null);
    this.lastError = null;
    this.lastStage = 'idle';
    this.iframeLoaded = false;
  }

  buildDom() {
    const shell = el('div', { class: 'player-shell', id: `shell-${this.id}` });
    if (this.config.type === 'iframe') {
      const iframe = el('iframe', {
        id: `iframe-${this.id}`,
        src: this.config.stream_url,
        allow: 'autoplay; fullscreen; encrypted-media; picture-in-picture',
        allowfullscreen: 'true',
        referrerpolicy: 'no-referrer',
        loading: 'eager',
        sandbox: 'allow-scripts allow-same-origin allow-presentation allow-forms allow-popups allow-popups-to-escape-sandbox'
      });
      shell.appendChild(iframe);
      this.iframeEl = iframe;
    } else {
      const video = el('video', {
        id: `video-${this.id}`,
        playsinline: '', controls: 'false', preload: 'auto'
      });
      video.muted = true;
      shell.appendChild(video);
      this.videoEl = video;
    }
    this.shellEl = shell;
    return shell;
  }

  async init() {
    if (this.initialized) return;

    if (this.config.type === 'iframe') {
      // iframe: check reachability, then mark ready
      this.app.setStage('testing iframe URL');
      const probe = await probeUrl(this.config.stream_url);
      this.lastProbe = probe;
      if (!probe.ok) {
        throw new Error(
          `iframe host not reachable.\n` +
          `Tried: ${this.config.stream_url}\n` +
          `Result: ${probe.error || 'HTTP ' + probe.status}\n\n` +
          `Likely X-Frame-Options or CSP frame-ancestors block. ` +
          `Use "Open URL" to load it in a new tab.`
        );
      }
      // Race: iframe load fires vs 6s timeout
      const ok = await new Promise(resolve => {
        let done = false;
        const finish = (v) => { if (!done) { done = true; resolve(v); } };
        this.iframeEl.addEventListener('load', () => { this.iframeLoaded = true; finish(true); }, { once: true });
        setTimeout(() => finish(false), 6000);
      });
      if (!ok) {
        throw new Error(
          `iframe did not fire load event within 6s.\n` +
          `Most likely blocked by X-Frame-Options / CSP.\n` +
          `Use "Open URL" to load externally.`
        );
      }
      this.initialized = true;
      this.state = 'ready';
      return;
    }

    // DASH
    if (typeof shaka === 'undefined') throw new Error('shaka-player CDN not loaded — check network');

    shaka.polyfill.installAll();
    if (!shaka.Player.isBrowserSupported())
      throw new Error('Browser does not support DASH playback (shaka says unsupported)');

    // 1) cookie
    this.app.setStage('fetching cookies');
    await this.cookies.load();
    this.app.debug(`[${this.id}] cookie: ${this.cookies.cookie ? 'yes (len ' + this.cookies.cookie.length + ')' : 'no'}`);

    // 2) probe manifest (direct then proxy)
    this.app.setStage('probing manifest (direct)');
    let manifestUrl = this.config.stream_url;
    let probe = await probeUrl(manifestUrl);
    if (!probe.ok) {
      this.app.debug(`[${this.id}] direct manifest failed: ${probe.error || probe.status}`);
      this.app.setStage('probing manifest (proxy)');
      const viaProxy = await probeUrl(manifestUrl, { proxy: true });
      if (viaProxy.ok) {
        manifestUrl = Proxy.wrap(manifestUrl);
        probe = viaProxy;
        this.app.debug(`[${this.id}] manifest OK via proxy`);
      } else {
        throw new Error(this._buildFetchError(probe, viaProxy));
      }
    } else {
      this.app.debug(`[${this.id}] manifest OK direct (${probe.status})`);
    }
    this.lastProbe = probe;

    // 3) build player
    this.app.setStage('building player');
    this.shaka = new shaka.Player();
    await this.shaka.attach(this.videoEl);
    this.shaka.addEventListener('error', (e) => this._onShakaError(e));

    const clearKeys = parseDrmKeys(this.config.drm_keys);
    this.shaka.configure({
      drm: {
        clearKeys,
        retryParameters: { maxAttempts: 2, baseDelay: 500, timeout: 20000 }
      },
      manifest: {
        retryParameters: { maxAttempts: 3, baseDelay: 500, backoffFactor: 2, timeout: 30000 }
      },
      streaming: {
        retryParameters: { maxAttempts: 3, baseDelay: 500, backoffFactor: 2, timeout: 30000 },
        bufferingGoal: 30, rebufferingGoal: 2
      },
      abr: { enabled: true, defaultBandwidthEstimate: 2000000 }
    });

    // Request filter: inject Cookie header AND rewrite segment URLs to proxy
    const net = this.shaka.getNetworkingEngine();
    if (net) {
      net.registerRequestFilter((type, request) => {
        if (this.cookies.cookie) {
          try { request.headers['Cookie'] = this.cookies.cookie; } catch {}
        }
        if (request.uris && request.uris.length) {
          const proxying = manifestUrl !== this.config.stream_url;
          if (proxying) {
            request.uris = request.uris.map(u =>
              u.startsWith(this.config.stream_url.split('/').slice(0, 3).join('/'))
                ? Proxy.wrap(u) : u
            );
          }
        }
      });
      net.registerResponseFilter((type, response) => {
        // no-op; place for future header inspection
      });
    }

    // 4) load manifest
    this.app.setStage(`loading manifest (${Object.keys(clearKeys).length} keys)`);
    try {
      await this.shaka.load(manifestUrl);
    } catch (err) {
      throw new Error(
        `shaka.load() failed at stage: ${this.lastStage}\n` +
        `Error code: ${err.code ?? '?'}\n` +
        `Message: ${err.message || err}\n\n` +
        this._friendlyShaka(err)
      );
    }

    // 5) verify a variant exists
    const variants = this.shaka.getVariantTracks();
    if (!variants.length) {
      throw new Error('Manifest loaded but no playable variants. Stream may be geo-blocked or offline.');
    }
    this.app.debug(`[${this.id}] ${variants.length} variants`);

    // 6) play + wait for either playing or first segment error
    this.app.setStage('autoplay');
    try {
      await Promise.race([
        this.videoEl.play(),
        new Promise((_, rej) => setTimeout(() => rej(new Error('autoplay timeout 5s')), 5000))
      ]);
    } catch (e) {
      this.app.debug(`[${this.id}] autoplay: ${e.message}`);
      // not fatal — user can press play
    }

    this.initialized = true;
    this.state = 'ready';
  }

  _buildFetchError(direct, proxied) {
    return (
      `Cannot fetch manifest.\n\n` +
      `Direct:  ${direct.error || 'HTTP ' + direct.status}\n` +
      `Proxy:   ${proxied.error || 'HTTP ' + proxied.status}\n\n` +
      `This usually means CORS is blocked by the CDN.\n\n` +
      `Fix: set a CORS proxy in the sidebar. Examples:\n` +
      `  • https://corsproxy.io/?\n` +
      `  • http://localhost:8080/?url=\n\n` +
      `Or run your own: npx local-cors-proxy --proxyUrl https://jiotvpllive.cdn.jio.com --port 8080`
    );
  }

  _friendlyShaka(err) {
    const c = err && err.code;
    const m = {
      1001: 'Network error on manifest/segment fetch — likely CORS still blocked on segments.',
      1002: 'Manifest parse error — MPD may be malformed or HTML error page returned.',
      1003: 'DRM/decryption error — clearKeys likely wrong or expired.',
      3016: 'Content encrypted, no matching key found. Keys list may be stale.',
      6001: 'Segment request failed — CDN is blocking or cookies expired.',
      6004: 'Segment fetch returned non-200.'
    };
    return m[c] ? `Interpretation: ${m[c]}` : `Interpretation: unknown shaka error ${c}.`;
  }

  _onShakaError(event) {
    const err = event.detail || event;
    this.lastError = err;
    this.app.debug(`[${this.id}] shaka error ${err.code}: ${err.message}`);
    // Only surface if this channel is active
    if (this.app.activeId !== this.id) return;
    this.app.showError(
      `Playback error (${err.code || '?'})`,
      `${err.message || 'unknown'}\n\n${this._friendlyShaka(err)}`
    );
  }

  async play() {
    if (!this.initialized) await this.init();
    if (this.videoEl) { try { await this.videoEl.play(); } catch {} }
  }
  pause() { if (this.videoEl) this.videoEl.pause(); }
  destroy() {
    if (this.shaka) { try { this.shaka.destroy(); } catch {} this.shaka = null; }
    this.initialized = false;
  }
}

/* ============================================================
   DIAGNOSTICS
   ============================================================ */
async function runDiagnostics(app) {
  const container = $('#diag-content');
  container.innerHTML = '<div style="font-size:12px;color:var(--text-dim);padding:8px 0;">Running probes...</div>';

  const results = [];
  for (const [id, cfg] of Object.entries(CHANNELS)) {
    const r = { id, cfg, checks: {} };
    const btn = app.buttons.get(id);
    if (btn) btn.querySelector('.ch-status')?.classList.add('testing');

    // cookie
    if (cfg.cookie_url) {
      const c = await probeUrl(cfg.cookie_url);
      let used = false;
      if (!c.ok) { r.checks.cookie_proxied = await probeUrl(cfg.cookie_url, { proxy: true }); used = r.checks.cookie_proxied.ok; }
      r.checks.cookie = c;
      r.checks.cookie_used_proxy = used;
    }

    // manifest/stream
    if (cfg.type === 'dash') {
      r.checks.manifest = await probeUrl(cfg.stream_url);
      if (!r.checks.manifest.ok) {
        r.checks.manifest_proxied = await probeUrl(cfg.stream_url, { proxy: true });
      }
    } else if (cfg.type === 'iframe') {
      r.checks.iframe = await probeUrl(cfg.stream_url);
    }

    results.push(r);
    const status = btn?.querySelector('.ch-status');
    if (status) {
      status.classList.remove('testing');
      const anyOk = Object.values(r.checks).some(x => x && x.ok);
      status.classList.add(anyOk ? 'ok' : 'fail');
    }
  }

  container.innerHTML = '';
  const proxy = Proxy.get();

  const summary = el('div', {
    style: 'font-size:12px;padding:10px;background:rgba(106,90,205,.15);border-radius:6px;margin-bottom:12px;color:var(--text-dim);line-height:1.6;',
    html: `<strong style="color:var(--text);">Proxy:</strong> ${proxy || '<em>not set</em>'}<br>` +
          `<strong style="color:var(--text);">Tip:</strong> If all manifest probes fail on direct, CORS is the problem. ` +
          `Set a proxy above and re-run.`
  });
  container.appendChild(summary);

  for (const r of results) {
    const card = el('div', { class: 'diag-channel' });
    card.appendChild(el('h3', {}, [
      el('span', { text: r.cfg.name }),
      el('span', { style: 'font-size:10px;color:var(--text-muted);font-weight:400;', text: `#${r.id}` })
    ]));

    const row = (label, value, kind = '') =>
      el('div', { class: 'diag-row' }, [
        el('span', { class: 'diag-label', text: label }),
        el('span', { class: `diag-value ${kind}`, text: value })
      ]);

    if (r.checks.cookie) {
      const c = r.checks.cookie;
      card.appendChild(row('cookie url',
        c.ok ? `OK ${c.status} (${c.size}B${r.checks.cookie_used_proxy ? ', via proxy' : ''})` :
              `FAIL ${c.error || 'HTTP ' + c.status}`,
        c.ok ? 'ok' : 'bad'));
    }
    if (r.checks.cookie_proxied) {
      card.appendChild(row('cookie proxy',
        r.checks.cookie_proxied.ok ? `OK ${r.checks.cookie_proxied.status}` : `FAIL ${r.checks.cookie_proxied.error}`,
        r.checks.cookie_proxied.ok ? 'ok' : 'bad'));
    }
    if (r.checks.manifest) {
      const m = r.checks.manifest;
      card.appendChild(row('manifest', m.ok ? `OK ${m.status} (${m.size}B)` : `FAIL ${m.error || 'HTTP ' + m.status}`,
        m.ok ? 'ok' : 'bad'));
    }
    if (r.checks.manifest_proxied) {
      const mp = r.checks.manifest_proxied;
      card.appendChild(row('manifest via proxy',
        mp.ok ? `OK ${mp.status} (${mp.size}B)` : `FAIL ${mp.error || 'HTTP ' + mp.status}`,
        mp.ok ? 'ok' : 'bad'));
    }
    if (r.checks.iframe) {
      const i = r.checks.iframe;
      card.appendChild(row('iframe url',
        i.ok ? `reachable ${i.status}` : `FAIL ${i.error || 'HTTP ' + i.status}`,
        i.ok ? 'ok' : 'bad'));
    }

    // Verdict
    let verdict, kind;
    if (r.cfg.type === 'dash') {
      const m = r.checks.manifest, mp = r.checks.manifest_proxied;
      const c = r.checks.cookie, cp = r.checks.cookie_proxied;
      const cookieOk = !r.cfg.cookie_url || (c && c.ok) || (cp && cp.ok);
      if (m && m.ok && cookieOk) { verdict = '✔ Should play directly — try clicking the channel.'; kind = 'ok'; }
      else if (mp && mp.ok && cookieOk) { verdict = '✔ Will play via proxy — set the proxy field above, then click channel.'; kind = 'ok'; }
      else if (!m?.ok && !mp?.ok) { verdict = '✘ Manifest unreachable even via proxy. CDN down, geo-blocked, or URL dead.'; kind = 'bad'; }
      else if (!cookieOk) { verdict = '✘ Cookie endpoint blocked. Tokens will be missing — segments will 403.'; kind = 'bad'; }
      else { verdict = '⚠ Uncertain.'; kind = 'warn'; }
    } else {
      const i = r.checks.iframe;
      verdict = i && i.ok
        ? '⚠ Host reachable, but iframe may still be blocked by X-Frame-Options. Click channel to test; if blank, use Open URL.'
        : '✘ Iframe host unreachable.';
      kind = i && i.ok ? 'warn' : 'bad';
    }
    card.appendChild(el('div', { class: `diag-verdict ${kind}`, text: verdict }));
    container.appendChild(card);
  }
}

/* ============================================================
   APP
   ============================================================ */
class App {
  constructor(channels) {
    this.channels = channels;
    this.controllers = new Map();
    this.shells = new Map();
    this.buttons = new Map();
    this.activeId = null;
    this.debugOn = false;
    this._cacheDom();
    this._buildChannelList();
    this._bindEvents();
  }

  _cacheDom() {
    this.$stage = $('#player-stage');
    this.$loading = $('#loading-overlay');
    this.$loadingTxt = $('#loading-text');
    this.$loadingStage = $('#loading-stage');
    this.$error = $('#error-overlay');
    this.$errorTitle = $('#error-title');
    this.$errorMsg = $('#error-msg');
    this.$debug = $('#debug-panel');
    this.$empty = $('#empty-state');
    this.$diag = $('#diag-overlay');
    this.$progress = $('#progress-bar');
    this.$progressFill = $('#progress-fill');
    this.$progressBuf = $('#progress-buffer');
    this.$timeCur = $('#time-current');
    this.$timeDur = $('#time-duration');
    this.$controls = $('#controls');
  }

  _buildChannelList() {
    const list = $('#channel-list');
    list.innerHTML = '';
    $('#channel-count').textContent = Object.keys(this.channels).length;
    for (const [id, cfg] of Object.entries(this.channels)) {
      const initials = cfg.name.replace(/\(.*?\)/g, '').trim().split(/\s+/).slice(0, 2)
        .map(w => w[0]?.toUpperCase() || '').join('');
      const btn = el('button', { class: 'channel-item', id: `chbtn-${id}`, 'data-name': cfg.name.toLowerCase() }, [
        el('div', { class: 'ch-icon', text: initials || '?' }),
        el('div', { class: 'ch-info' }, [
          el('div', { class: 'ch-name', text: cfg.name }),
          el('div', { class: 'ch-meta', text: `${cfg.type} • ${id}` })
        ]),
        el('span', { class: 'ch-status unknown' })
      ]);
      btn.addEventListener('click', () => this.activate(id));
      list.appendChild(btn);
      this.buttons.set(id, btn);
    }
  }

  setStage(text) { this.$loadingStage.textContent = text; }

  setLoading(on, text, stage) {
    this.$loading.classList.toggle('active', !!on);
    if (text) this.$loadingTxt.textContent = text;
    if (stage) this.$loadingStage.textContent = stage;
  }

  showError(title, msg) {
    this.$errorTitle.textContent = title;
    this.$errorMsg.textContent = msg;
    this.$error.classList.add('active');
  }
  hideError() { this.$error.classList.remove('active'); }

  debug(msg) {
    if (!this.debugOn) return;
    const t = new Date().toLocaleTimeString();
    this.$debug.textContent += `[${t}] ${msg}\n`;
    const lines = this.$debug.textContent.split('\n');
    if (lines.length > 60) this.$debug.textContent = lines.slice(-60).join('\n');
    this.$debug.scrollTop = this.$debug.scrollHeight;
  }

  async activate(id) {
    if (!this.channels[id]) return;
    if (this.activeId === id) return;

    // Deactivate previous
    if (this.activeId) {
      const prev = this.controllers.get(this.activeId);
      if (prev) prev.pause();
      this.shells.get(this.activeId)?.classList.remove('active');
      this.buttons.get(this.activeId)?.classList.remove('active');
    }
    this.activeId = id;
    this.buttons.get(id)?.classList.add('active');
    this.$empty.style.display = 'none';
    this.hideError();

    // Ensure controller
    if (!this.controllers.has(id)) {
      const ctrl = new ChannelController(id, this.channels[id], this);
      this.controllers.set(id, ctrl);
      const shell = ctrl.buildDom();
      this.$stage.insertBefore(shell, this.$stage.firstChild);
      this.shells.set(id, shell);
      this._wireVideo(id, ctrl);
    }
    this.shells.get(id)?.classList.add('active');

    const ctrl = this.controllers.get(id);
    this.setLoading(true, `Loading ${this.channels[id].name}...`, 'init');
    try {
      await ctrl.init();
      this.setLoading(false);
      if (this.channels[id].type === 'dash') {
        await ctrl.play();
        this._updateControls();
      } else {
        // iframe: hide controls
        this.$controls.style.display = 'none';
      }
      this.buttons.get(id)?.querySelector('.ch-status')?.classList.remove('unknown','fail');
      this.buttons.get(id)?.querySelector('.ch-status')?.classList.add('ok');
    } catch (err) {
      this.setLoading(false);
      this.buttons.get(id)?.querySelector('.ch-status')?.classList.remove('unknown','ok');
      this.buttons.get(id)?.querySelector('.ch-status')?.classList.add('fail');
      this.showError('Playback failed', err.message || String(err));
      this.debug(`[${id}] init error: ${err.message}`);
    }
  }

  _wireVideo(id, ctrl) {
    const v = ctrl.videoEl;
    if (!v) return;
    v.addEventListener('play', () => { if (this.activeId === id) this._syncPlay(); });
    v.addEventListener('pause', () => { if (this.activeId === id) this._syncPlay(); });
    v.addEventListener('timeupdate', () => { if (this.activeId === id) this._syncProgress(); });
    v.addEventListener('progress', () => { if (this.activeId === id) this._syncProgress(); });
    v.addEventListener('volumechange', () => { if (this.activeId === id) this._syncVol(); });
    v.addEventListener('error', () => {
      if (this.activeId !== id) return;
      const e = v.error;
      this.showError('Media error', e ? `code ${e.code}: ${e.message}` : 'unknown');
    });
  }

  _updateControls() {
    this.$controls.style.display = '';
    this._syncPlay(); this._syncVol(); this._syncProgress();
  }
  _syncPlay() {
    const c = this.controllers.get(this.activeId); const v = c && c.videoEl; if (!v) return;
    $('#btn-play').textContent = (!v.paused && !v.ended) ? '⏸' : '▶';
  }
  _syncVol() {
    const c = this.controllers.get(this.activeId); const v = c && c.videoEl; if (!v) return;
    $('#btn-mute').textContent = (v.muted || v.volume === 0) ? '🔇' : '🔊';
    $('#volume-slider').value = v.muted ? 0 : v.volume;
  }
  _syncProgress() {
    const c = this.controllers.get(this.activeId); const v = c && c.videoEl; if (!v) return;
    const dur = v.duration, cur = v.currentTime;
    const isLive = !isFinite(dur) || dur === Infinity;
    this.$timeDur.textContent = isLive ? 'LIVE' : fmtTime(dur);
    this.$timeCur.textContent = fmtTime(cur);
    this.$progressFill.style.width = isLive ? '100%' : `${dur > 0 ? (cur / dur) * 100 : 0}%`;
    try {
      if (v.buffered.length) {
        const b = v.buffered.end(v.buffered.length - 1);
        this.$progressBuf.style.width = isLive ? '100%' : `${Math.min((b / dur) * 100, 100)}%`;
      }
    } catch {}
  }

  _bindEvents() {
    // Search
    $('#channel-search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      for (const [id, btn] of this.buttons) {
        const show = !q || btn.dataset.name.includes(q) || id.toLowerCase().includes(q);
        btn.style.display = show ? '' : 'none';
      }
    });

    // Debug toggle
    $('#debug-btn').addEventListener('click', () => {
      this.debugOn = !this.debugOn;
      this.$debug.classList.toggle('on', this.debugOn);
      $('#debug-btn').classList.toggle('on', this.debugOn);
    });

    // Proxy input
    const proxyInput = $('#proxy-input');
    proxyInput.value = Proxy.get();
    proxyInput.addEventListener('change', () => {
      Proxy.set(proxyInput.value.trim());
      toast('Proxy saved. Reload channels.', 'success');
    });

    // Reload
    $('#reload-btn').addEventListener('click', () => location.reload());

    // Diagnostics
    $('#diag-btn').addEventListener('click', () => {
      this.$diag.classList.add('active');
      runDiagnostics(this);
    });
    $('#diag-close').addEventListener('click', () => this.$diag.classList.remove('active'));

    // Controls
    $('#btn-play').addEventListener('click', () => {
      const c = this.controllers.get(this.activeId); const v = c && c.videoEl; if (!v) return;
      if (v.paused) v.play().catch(() => {}); else v.pause();
    });
    $('#btn-mute').addEventListener('click', () => {
      const c = this.controllers.get(this.activeId); const v = c && c.videoEl; if (!v) return;
      v.muted = !v.muted;
    });
    $('#volume-slider').addEventListener('input', (e) => {
      const c = this.controllers.get(this.activeId); const v = c && c.videoEl; if (!v) return;
      const val = parseFloat(e.target.value);
      v.volume = val; v.muted = val === 0;
    });
    this.$progress.addEventListener('click', (e) => {
      const c = this.controllers.get(this.activeId); const v = c && c.videoEl;
      if (!v || !isFinite(v.duration)) return;
      const r = this.$progress.getBoundingClientRect();
      v.currentTime = ((e.clientX - r.left) / r.width) * v.duration;
    });
    $('#btn-fullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) this.$stage.requestFullscreen?.();
      else document.exitFullscreen?.();
    });
    $('#btn-pip').addEventListener('click', async () => {
      const c = this.controllers.get(this.activeId); const v = c && c.videoEl;
      if (!v) return;
      try {
        if (document.pictureInPictureElement) await document.exitPictureInPicture();
        else await v.requestPictureInPicture();
      } catch (err) { toast('PiP: ' + err.message, 'error'); }
    });

    // Error buttons
    $('#error-dismiss').addEventListener('click', () => this.hideError());
    $('#error-open').addEventListener('click', () => {
      const c = this.controllers.get(this.activeId);
      const url = c?.config.stream_url;
      if (url) window.open(url, '_blank', 'noopener');
    });
    $('#error-diag').addEventListener('click', () => {
      this.$diag.classList.add('active');
      runDiagnostics(this);
    });
    $('#error-retry').addEventListener('click', () => {
      this.hideError();
      const id = this.activeId; if (!id) return;
      const c = this.controllers.get(id);
      if (c) c.destroy();
      this.controllers.delete(id);
      this.shells.get(id)?.remove();
      this.shells.delete(id);
      this.buttons.get(id)?.classList.remove('active');
      this.activeId = null;
      setTimeout(() => this.activate(id), 100);
    });

    // Controls auto-hide
    this.$stage.addEventListener('mousemove', () => {
      this.$stage.classList.add('controls-visible');
      clearTimeout(this._ctrlT);
      this._ctrlT = setTimeout(() => this.$stage.classList.remove('controls-visible'), 3000);
    });

    // Mobile menu
    $('#mobile-menu-btn').addEventListener('click', () => {
      $('#sidebar').classList.toggle('open');
    });
  }
}

/* ============================================================
   BOOT
   ============================================================ */
window.addEventListener('DOMContentLoaded', () => {
  const app = new App(CHANNELS);
  window.__app = app;
  app.debug('app booted; proxy=' + (Proxy.get() || 'none'));
});
</script>
