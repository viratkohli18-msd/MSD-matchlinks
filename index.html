<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Live Stream</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #000000;
    --surface: #0a0a0a;
    --surface-hover: #111111;
    --border: #1a1a1a;
    --text: #e0e0e0;
    --text-dim: #555555;
    --accent: #ff3333;
    --accent-glow: rgba(255, 51, 51, 0.1);
}

html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    font-family: 'Inter', -apple-system, sans-serif;
    overflow: hidden;
    color: var(--text);
}

/* ===== LOADER ===== */
.loader {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    transition: opacity 0.4s ease;
}

.loader.done {
    opacity: 0;
    pointer-events: none;
}

.loader-ring {
    width: 36px;
    height: 36px;
    border: 2px solid var(--border);
    border-top-color: var(--text);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.loader-text {
    margin-top: 14px;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 3px;
    text-transform: uppercase;
}

/* ===== TOP BAR ===== */
.topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 48px;
    background: rgba(0,0,0,0.92);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 100;
}

.logo {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 3px;
    color: var(--text);
    text-transform: uppercase;
}

.live-pill {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    background: var(--accent-glow);
    border: 1px solid rgba(255,51,51,0.25);
    border-radius: 20px;
}

.live-dot {
    width: 5px;
    height: 5px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 1.5s ease infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
}

.live-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 1px;
}

.tg-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s;
}

.tg-btn:hover {
    border-color: #0088cc;
    color: #0088cc;
    background: rgba(0,136,204,0.05);
}

.tg-btn svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
}

/* ===== MAIN ===== */
.main {
    display: flex;
    height: 100vh;
    padding-top: 48px;
}

/* ===== VIDEO ===== */
.video-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
}

.player-wrap {
    flex: 1;
    position: relative;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
}

#main-iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: none;
}

#main-iframe.active {
    display: block;
}

.placeholder {
    text-align: center;
    padding: 40px;
}

.placeholder-icon {
    font-size: 36px;
    margin-bottom: 14px;
    opacity: 0.25;
}

.placeholder-title {
    font-size: 14px;
    color: var(--text-dim);
    margin-bottom: 6px;
    font-weight: 500;
}

.placeholder-hint {
    font-size: 12px;
    color: var(--text-dim);
    opacity: 0.5;
}

/* ===== CONTROLS ===== */
.controls {
    height: 50px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 16px;
    overflow-x: auto;
    scrollbar-width: none;
}

.controls::-webkit-scrollbar {
    display: none;
}

.ctrl-group {
    display: flex;
    align-items: center;
    gap: 5px;
}

.ctrl-label {
    font-size: 9px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 2px;
    white-space: nowrap;
    margin-right: 4px;
}

.q-btn {
    padding: 5px 9px;
    border-radius: 4px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
}

.q-btn:hover {
    color: var(--text);
    background: var(--surface-hover);
}

.q-btn.on {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
}

.a-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
}

.a-btn:hover {
    border-color: var(--text-dim);
    color: var(--text);
}

.a-btn.on {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
}

.fs-btn {
    width: 30px;
    height: 30px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
}

.fs-btn:hover {
    border-color: var(--text-dim);
}

.fs-btn svg {
    width: 13px;
    height: 13px;
    fill: var(--text-dim);
}

.ctrl-divider {
    width: 1px;
    height: 18px;
    background: var(--border);
    flex-shrink: 0;
}

/* ===== SIDEBAR ===== */
.sidebar {
    width: 260px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.sb-head {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 10px;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.sb-count {
    font-size: 10px;
    color: var(--text-dim);
    background: var(--bg);
    padding: 2px 8px;
    border-radius: 10px;
}

.sb-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px;
}

.sb-list::-webkit-scrollbar {
    width: 3px;
}

.sb-list::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 2px;
}

.match-row {
    padding: 10px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    border: 1px solid transparent;
    margin-bottom: 3px;
}

.match-row:hover {
    background: var(--surface-hover);
    border-color: var(--border);
}

.match-row.on {
    background: var(--surface-hover);
    border-color: rgba(255,51,51,0.2);
}

.match-row.on .match-name {
    color: var(--text);
}

.match-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
}

.match-id {
    font-size: 10px;
    color: var(--text-dim);
    opacity: 0.6;
    font-family: monospace;
}

.match-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: var(--text-dim);
}

.match-live-tag {
    display: flex;
    align-items: center;
    gap: 3px;
    color: var(--accent);
    font-weight: 600;
    font-size: 9px;
}

.match-live-tag .dot {
    width: 3px;
    height: 3px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 1.5s ease infinite;
}

/* ===== ERROR ===== */
.error-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    padding: 40px;
    text-align: center;
}

.error-screen.show {
    display: flex;
}

.error-icon {
    font-size: 32px;
    margin-bottom: 14px;
    opacity: 0.4;
}

.error-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text);
}

.error-msg {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 20px;
    max-width: 280px;
    line-height: 1.5;
}

.error-retry {
    padding: 10px 24px;
    background: var(--text);
    color: var(--bg);
    border: none;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.2s;
}

.error-retry:hover {
    opacity: 0.9;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
    .sidebar { display: none; }
    .ctrl-label { display: none; }
    .controls { gap: 8px; padding: 0 12px; }
    .q-btn { padding: 4px 7px; font-size: 10px; }
}

@media (max-width: 480px) {
    .logo { font-size: 11px; }
    .tg-btn span { display: none; }
    .live-pill { padding: 3px 8px; }
    .live-label { font-size: 9px; }
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<!-- Loader -->
<div class="loader" id="loader">
    <div class="loader-ring"></div>
    <div class="loader-text">Loading</div>
</div>

<!-- Error -->
<div class="error-screen" id="errorScreen">
    <div class="error-icon">📡</div>
    <div class="error-title" id="errTitle">Stream Unavailable</div>
    <div class="error-msg" id="errMsg">Could not load the requested stream.</div>
    <button class="error-retry" onclick="location.reload()">Retry</button>
</div>

<!-- Top Bar -->
<div class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
        <div class="logo">LIVE</div>
        <div class="live-pill">
            <span class="live-dot"></span>
            <span class="live-label">ON AIR</span>
        </div>
    </div>
    <a href="https://telegram.me/YOUR_CHANNEL" target="_blank" class="tg-btn" id="tgBtn">
        <svg viewBox="0 0 24 24"><path d="M9.993 15.674l-.398 5.604c.57 0 .817-.245 1.113-.54l2.67-2.557 5.53 4.047c1.014.558 1.734.264 1.987-.939l3.6-16.86.001-.001c.3-1.4-.506-1.95-1.496-1.58L1.27 9.64c-1.37.53-1.35 1.29-.233 1.64l5.68 1.77L19.29 5.73c.59-.39 1.13-.175.69.215"/></svg>
        <span>Channel</span>
    </a>
</div>

<!-- Main -->
<div class="main">

    <!-- Video -->
    <div class="video-area">
        <div class="player-wrap">
            <iframe id="main-iframe" allowfullscreen allow="encrypted-media; fullscreen; autoplay"></iframe>

            <div class="placeholder" id="placeholder">
                <div class="placeholder-icon">📺</div>
                <div class="placeholder-title">Select a channel</div>
                <div class="placeholder-hint">Choose from the sidebar</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="ctrl-group">
                <span class="ctrl-label">Quality</span>
                <button class="q-btn" data-q="144p">144p</button>
                <button class="q-btn" data-q="240p">240p</button>
                <button class="q-btn" data-q="360p">360p</button>
                <button class="q-btn on" data-q="480p">480p</button>
                <button class="q-btn" data-q="720p">720p</button>
                <button class="q-btn" data-q="1080p">1080p</button>
                <button class="q-btn" data-q="4k">4K</button>
            </div>

            <div class="ctrl-divider"></div>

            <div class="ctrl-group">
                <button class="a-btn" id="aBtn">
                    <span>EN</span>
                </button>
            </div>

            <div class="ctrl-divider"></div>

            <button class="fs-btn" id="fsBtn" title="Fullscreen (F)">
                <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            </button>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sb-head">
            <span>Channels</span>
            <span class="sb-count" id="chCount">0</span>
        </div>
        <div class="sb-list" id="sbList"></div>
    </div>

</div>

<script>
// ===== CONFIG =====
const CFG = {
    json: 'https://msd-matchlinkz.pages.dev/id.json',
    tg: 'https://telegram.me/SILENT_NETWORK_OPP'
};

// ===== STATE =====
let streams = [];
let current = null;
let quality = '480p';
let hindi = false;

// ===== DOM =====
const $ = id => document.getElementById(id);
const iframe = $('main-iframe');
const placeholder = $('placeholder');
const loader = $('loader');
const errScreen = $('errorScreen');
const errTitle = $('errTitle');
const errMsg = $('errMsg');
const sbList = $('sbList');
const chCount = $('chCount');

// ===== INIT =====
window.addEventListener('DOMContentLoaded', () => {
    $('tgBtn').href = CFG.tg;

    const params = new URLSearchParams(location.search);
    const id = params.get('id');

    loadData(id);
    setupControls();
});

// ===== LOAD DATA =====
async function loadData(targetId) {
    try {
        const res = await fetch(CFG.json);
        const data = await res.json();
        streams = data.iframes || [];

        renderList();

        if (targetId) loadStream(targetId);
        else loader.classList.add('done');

    } catch(e) {
        showErr('Load Failed', 'Could not fetch channel data.');
    }
}

// ===== RENDER LIST =====
function renderList() {
    sbList.innerHTML = '';
    chCount.textContent = streams.length;

    if (!streams.length) {
        sbList.innerHTML = '<div style="padding:30px;text-align:center;color:#555;font-size:11px;">No channels</div>';
        return;
    }

    streams.forEach(s => {
        const row = document.createElement('div');
        row.className = 'match-row';
        row.dataset.id = s.id;
        row.innerHTML = `
            <div class="match-name">
                <span>${s.name || s.id}</span>
            </div>
            <div class="match-meta">
                <span class="match-live-tag"><span class="dot"></span>LIVE</span>
                <span class="match-id">${s.id}</span>
            </div>
        `;

        row.addEventListener('click', () => {
            document.querySelectorAll('.match-row').forEach(r => r.classList.remove('on'));
            row.classList.add('on');
            loadStream(s.id);
            history.pushState({}, '', '?id=' + s.id);
        });

        sbList.appendChild(row);
    });
}

// ===== LOAD STREAM =====
function loadStream(id) {
    const s = streams.find(x => x.id === id);
    if (!s) return showErr('Not Found', 'Channel ID not found: ' + id);

    current = s;
    loader.classList.remove('done');
    placeholder.style.display = 'none';

    let url = s.iframeSrc;

    iframe.src = url;
    iframe.classList.add('active');

    iframe.onload = () => loader.classList.add('done');
    iframe.onerror = () => showErr('Stream Error', 'Failed to load channel.');

    if (s.hit) fetch(s.hit).catch(()=>{});

    document.querySelectorAll('.match-row').forEach(r => {
        r.classList.toggle('on', r.dataset.id === id);
    });
}

// ===== CONTROLS =====
function setupControls() {
    document.querySelectorAll('.q-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('on'));
            btn.classList.add('on');
            quality = btn.dataset.q;
        });
    });

    const aBtn = $('aBtn');
    aBtn.addEventListener('click', () => {
        hindi = !hindi;
        aBtn.classList.toggle('on', hindi);
        aBtn.querySelector('span').textContent = hindi ? 'HI' : 'EN';
    });

    $('fsBtn').addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    });
}

// ===== ERROR =====
function showErr(title, msg) {
    loader.classList.add('done');
    errTitle.textContent = title;
    errMsg.textContent = msg;
    errScreen.classList.add('show');
}

// ===== KEYS =====
document.addEventListener('keydown', e => {
    if (e.key === 'f') $('fsBtn').click();
    if (e.key === 'a') $('aBtn').click();
});

// ===== POPUP =====
if (!localStorage.getItem('v')) {
    setTimeout(() => {
        if (confirm('Join our Telegram for latest links?')) window.open(CFG.tg, '_blank');
        localStorage.setItem('v', '1');
    }, 3000);
}
</script>
</body>
  </html>
